name: StudyHelp
options:
  bundleIdPrefix: com.darrelross
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # HTML parsing for the native reader (specs/native-reader.md). Lenient
  # real-world parser (jsoup port) — publisher HTML is not well-formed XML.
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"

settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    # Set your team to enable automatic signing:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  StudyHelp:
    type: application
    platform: iOS
    sources:
      - StudyHelp
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darrelross.studyhelp
        INFOPLIST_FILE: StudyHelp/Info.plist
        CODE_SIGN_ENTITLEMENTS: StudyHelp/StudyHelp.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DailyWidgetExtension
      # App target only — the widget never parses or fetches scripture text.
      - package: SwiftSoup

  DailyWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - DailyWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darrelross.studyhelp.DailyWidget
        INFOPLIST_FILE: DailyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DailyWidget/DailyWidget.entitlements
        CODE_SIGN_STYLE: Automatic

  StudyHelpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StudyHelpTests
    dependencies:
      - target: StudyHelp
    settings:
      base:
        # Tests reach Shared types via `@testable import StudyHelp`, so the
        # Shared sources are NOT recompiled here (avoids duplicate symbols).
        GENERATE_INFOPLIST_FILE: YES
