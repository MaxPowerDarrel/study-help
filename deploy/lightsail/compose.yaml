# Production compose for AWS Lightsail (or any single-VM Docker host).
#
# Two services on the default bridge network:
#   - app    : the study-help binary (pulled from a registry, never built here)
#   - caddy  : terminates TLS on :80/:443 and reverse-proxies to app:8080
#
# Substitutions come from a sibling .env file (see .env.example). The local
# `compose.yaml` at the repo root is a different concern: it builds an image
# for local dev. Do not run both at once on the same host.
#
# The server is stateless (no SQLite, no per-user data) since 2026-05-07,
# so this stack carries no persistent volumes for app data — the only
# volumes are Caddy's cert / state caches.

services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      ENV: prod
      ESV_API_KEY: ${ESV_API_KEY}
      YOUVERSION_APP_KEY: ${YOUVERSION_APP_KEY}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
