services:
  app:
    build: .
    ports:
      # Override the host port via APP_PORT (e.g. APP_PORT=18080) when 8080
      # is already in use locally. Container port stays 8080.
      - "${APP_PORT:-8080}:8080"
    environment:
      # Listed without values — Compose passes them through from the host shell.
      ESV_API_KEY:
      YOUVERSION_APP_KEY:
